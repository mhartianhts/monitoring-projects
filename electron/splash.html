<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Project Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      text-align: center;
      padding: 40px;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(134, 59, 255, 0.25);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(134, 59, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
    }
    .logo-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    .logo-container img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      filter: drop-shadow(0 0 16px rgba(134, 59, 255, 0.6));
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .spinner-bar {
      width: 180px;
      height: 4px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .spinner-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #863bff, #38bdf8);
      border-radius: 999px;
      animation: loading 1.4s infinite cubic-bezier(0.65, 0, 0.35, 1);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="assets/icon.png" alt="Logo">
    </div>
    <h1>Local Project Manager</h1>
    <p id="status-text">Menghubungkan ke service & dashboard...</p>
    <div class="spinner-bar"></div>
  </div>
</body>
</html>
